<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>מאמן קריאת תווים</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      direction: rtl;
      text-align: right;
    }

    h1 { color: #333; }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover { background-color: #45a049; }

    select { padding: 5px 10px; }

    #status { font-weight: bold; }
    #expectedNote {
      font-size: 24px;
      font-weight: bold;
      margin-top: 20px;
      color: #2196F3;
    }
    #staff { margin-top: 20px; direction: ltr; }
    #score { font-size: 18px; margin-top: 15px; }
    
    .virtual-key {
  display: inline-block;
  width: 44px;
  height: 80px;
  margin: 2px;
  background: #eee;
  border: 1px solid #999;
  border-radius: 4px;
  text-align: center;
  line-height: 80px;
  cursor: pointer;
  user-select: none;
}
.virtual-key:hover {
  background: #ddd;
}

/* Chord dialog */
.chord-dialog-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
.chord-dialog-overlay.open { display: flex; }
.chord-dialog {
  background: white;
  border-radius: 12px;
  padding: 24px;
  max-width: 700px;
  width: 90%;
  max-height: 85vh;
  overflow-y: auto;
  direction: rtl;
}
.chord-dialog h2 { margin-top: 0; }
.chord-card {
  margin-bottom: 20px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
.chord-card h3 { margin: 0 0 8px 0; }
.mini-piano {
  display: flex;
  direction: ltr;
  position: relative;
  height: 80px;
  margin: 0 auto;
  width: fit-content;
}
.mini-piano .white-key {
  width: 32px;
  height: 80px;
  border: 1px solid #999;
  border-radius: 0 0 4px 4px;
  background: #fff;
  position: relative;
  z-index: 1;
}
.mini-piano .white-key.pressed {
  background: #4CAF50;
}
.mini-piano .black-key {
  width: 20px;
  height: 50px;
  background: #333;
  border-radius: 0 0 3px 3px;
  position: absolute;
  z-index: 2;
}
.mini-piano .black-key.pressed {
  background: #66BB6A;
}
.mini-piano .key-label {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: #666;
  z-index: 3;
  pointer-events: none;
}
.mini-piano .white-key.pressed .key-label { color: white; }

  </style>
</head>

<body>
  <h1>מאמן קריאת תווים 🎹</h1>

  <button id="connect">חבר MIDI</button>
<label style="margin-right:10px;">
  <input type="checkbox" id="mockMidiToggle" />
  Mock MIDI
</label>

  <p id="status">לא מחובר</p>

  <div style="margin: 20px 0;">
    <label>
      <strong>יד ימין:</strong>
      <select id="rightHandMode">
        <option value="notes">תווים</option>
        <option value="chords">אקורדים</option>
        <option value="none">כלום</option>
      </select>
    </label>

    <label style="margin-right: 15px;">
      <strong>יד שמאל:</strong>
      <select id="leftHandMode">
        <option value="notes">תווים</option>
        <option value="chords">אקורדים</option>
        <option value="none">כלום</option>
      </select>
    </label>

    <label><input type="checkbox" id="toggleNoteNames" checked /> הצג שמות תווים</label><br/>
    <label><input type="checkbox" id="toggle4Fingers" /> 4 אצבעות</label><br/>
    <label><input type="checkbox" id="toggleDurations"  /> בדוק אורך תו</label><br/>
    <label><input type="checkbox" id="toggleMetronome" /> מטרונום</label><br/>
    <label><input type="checkbox" id="toggleLearningMode" /> מצב לימוד</label><br/>
    <button id="showChordsBtn" style="margin-top:8px; font-size:14px; padding:6px 14px;">תראה לי אקורדים</button>
  </div>

<div class="chord-dialog-overlay" id="chordDialogOverlay">
  <div class="chord-dialog">
    <h2>אקורדים בתרגול</h2>
    <div id="chordCards"></div>
    <button id="closeChordDialog" style="margin-top:10px;">סגור</button>
  </div>
</div>

  <p id="expectedNote"></p>

  <p id="score">
    ✅ נכון: <span id="correctCount">0</span>
    ❌ שגוי: <span id="wrongCount">0</span>
    <button id="resetScore">אפס</button>
  </p>
<div id="virtualKeyboard" style="display:none; margin-top:20px; direction:ltr;">
  <strong>🎹 מקלדת וירטואלית</strong>
  <div id="keys" style="margin-top:10px;"></div>
</div>

<div id="agentSuggestion" style="display:none; margin-top:15px;">
  🤖 שמתי לב שיש קושי חוזר. רוצה תרגול ממוקד?
  <button id="agentYes">כן</button>
  <button id="agentNo">לא עכשיו</button>
</div>


  <div id="practiceOutput" style="display:none; margin-top:20px;">
    <h3>תרגול ממוקד מוכן 🎯</h3>
    <span id="practiceProgress"></span>
  </div>

  <div id="staff"></div>

  <script src="https://unpkg.com/vexflow@4.2.5/releases/vexflow-min.js"></script>
    <script src="config.js"></script>
        <script src="agent.js"></script>
    <script src="midiInput.js"></script>
    <script src="app.js"></script>

</body>
</html>
